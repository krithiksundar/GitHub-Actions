
name: My First Action # Name of your workflow (appears in GitHub Actions tab)

on:
  push:            # Trigger workflow when code is pushed
    branches:
      - Main       # Runs only when pushing to 'main' branch
      - New

jobs:
  Actions:           # Name of the job
    runs-on: ubuntu-latest   # The virtual environment (Ubuntu, Windows, macOS)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4   # Step 1: Fetch repository code

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'    # Specify your Python version

      - name: Run Code
        run: python script.py

      - name: Publish changes back to repo
        uses: mikeal/publish-to-github-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          BRANCH_NAME: ${{ github.ref_name }}
        

